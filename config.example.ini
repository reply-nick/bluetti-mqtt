[bluetti]
# MAC address of the power station (BBQ_FP on BLE).
mac = 1C:DB:D4:52:6D:D2
# Device model. Leave empty to auto-detect at startup. Must match the device
# name prefix used by bluetti-bt-lib (e.g. FP, AC70, EP600).
model = FP
# Display name used for the Home Assistant device.
name = Bluetti FP
# Seconds between BLE reads.
poll_interval = 20
# Hard timeout for a single BLE read. Reads that take longer are aborted and
# the last-known-good data is kept (device shown as offline in HA).
read_timeout = 40
# Optional: write every poll result to this JSON file (used by the MQTT-NUT
# bridge). Each write carries a "connection" block: status online/offline,
# fail_streak, last_ok and, on failures, last_error/last_fail. Empty = off.
state_file = /run/bluetti/state.json

[mqtt]
# Broker address. Set to CHANGE_ME placeholders are rejected until edited.
host = CHANGE_ME
port = 1883
username = mqtt
password =
# Set to true for TLS (and adjust port to 8883).
tls = false
# Home Assistant MQTT discovery prefix.
discovery_prefix = homeassistant